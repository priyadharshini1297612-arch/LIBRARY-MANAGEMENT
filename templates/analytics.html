
<!DOCTYPE html>
<html>
<head>
    <title>Top Borrowed Books</title>
</head>

<body>

    <h1>Top Borrowed Books</h1>

    <table border="1">

        <tr>
            <th>Book ID</th>
            <th>Times Borrowed</th>
        </tr>

        {% for book in books %}

        <tr>
            <td>{{ book.book_id }}</td>
            <td>{{ book.count }}</td>
        </tr>

        {% endfor %}

    </table>

    <br>

    <a href="/">Back to Home</a>

</body>
</html>
